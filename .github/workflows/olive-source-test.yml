name: Olive Monitor - API Diagnostic V4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install -q playwright
      - name: Diagnose official online option API
        shell: bash
        run: |
          xvfb-run -a python - <<'PY'
          from playwright.sync_api import sync_playwright
          products = [
              ('A000000255435', {'007':'[단품]107', '009':'[단품]109'}),
              ('A000001004502', {'001':'J02', '002':'J05'}),
          ]
          script = """async goods => {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 10000);
            try {
              const response = await fetch('/goods/api/v1/detail?goodsNo=' + goods,
                                           {signal: ctl.signal, headers:{Accept:'application/json'}});
              const type = response.headers.get('content-type') || '';
              const cf = response.headers.get('cf-mitigated') || 'none';
              if (!response.ok || !type.toLowerCase().includes('json'))
                return {http: response.status, type, cf, data: null};
              const body = await response.text();
              if (body.length > 500000)
                return {http: response.status, type, cf, error: 'oversize'};
              try {return {http: response.status, type, cf, data: JSON.parse(body)};}
              catch(e) {return {http: response.status, type, cf, error: 'invalid_json'};}
            } catch(e) {return {error: e.name};}
            finally {clearTimeout(timer);}
          }"""
          valid_count = 0
          with sync_playwright() as pw:
              browser = pw.chromium.launch(channel='chrome', headless=False)
              try:
                  for goods, wanted in products:
                      context = browser.new_context(locale='ko-KR', service_workers='block')
                      try:
                          page = context.new_page()
                          url = 'https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo=' + goods
                          response = page.goto(url, wait_until='domcontentloaded', timeout=25000)
                          print('\nGOODS:', goods, 'PAGE_HTTP:', response.status if response else 'none', flush=True)
                          if not response or response.status != 200 or response.headers.get('cf-mitigated') == 'challenge':
                              print('PAGE_BLOCKED_OR_FAILED', flush=True)
                              continue
                          page.wait_for_timeout(3000)
                          outcome = page.evaluate(script, goods)
                          print('API_HTTP:', outcome.get('http', 'none'),
                                'CF:', outcome.get('cf', 'none'),
                                'TYPE:', outcome.get('type', 'none'),
                                'ERROR:', outcome.get('error', 'none'), flush=True)
                          data = outcome.get('data')
                          details = data.get('data') if isinstance(data, dict) and data.get('status') == 'SUCCESS' else None
                          if not isinstance(details, dict) or details.get('goodsNumber') != goods or not isinstance(details.get('options'), list):
                              print('VALID_JSON: NO', flush=True)
                              continue
                          print('VALID_JSON: YES', flush=True)
                          valid_count += 1
                          for opt_num, label in wanted.items():
                              matches = [o for o in details['options'] if isinstance(o, dict) and str(o.get('optionNumber')) == opt_num and label in str(o.get('optionName', ''))]
                              if len(matches) != 1:
                                  state = 'UNKNOWN'
                              elif matches[0].get('soldOutFlag') is True:
                                  state = 'OUT'
                              elif matches[0].get('soldOutFlag') is False and details.get('saleableFlag') is True:
                                  state = {True:'PREORDER', False:'STOCK'}.get(matches[0].get('reservationFlag'), 'UNKNOWN')
                              else:
                                  state = 'UNKNOWN'
                              print('OPTION:', opt_num, 'STATE:', state, flush=True)
                      except Exception as error:
                          print('DIAGNOSTIC_EXCEPTION:', type(error).__name__, flush=True)
                      finally:
                          context.close()
              finally:
                  browser.close()
          print('\nVALID_PRODUCTS:', str(valid_count) + '/2', flush=True)
          print('DIAGNOSTIC_DONE (no notifications sent)', flush=True)
          PY
                    # END - OLIVE MONITOR V4
          PY
          # END - OLIVE MONITOR V4
