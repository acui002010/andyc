
name: Olive Monitor - Scheduled Source Pilot V6

'on':
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: python -m pip install -q playwright

      - name: Inspect online orderability
        shell: bash
        run: |
          xvfb-run -a python - <<'PY'
          from playwright.sync_api import sync_playwright
          print('OLIVE_MONITOR_VERSION: V6', flush=True)

          items = [
              ('A000000255435', {'007':'[단품]107', '009':'[단품]109'}),
              ('A000001004502', {'001':'J02', '002':'J05'}),
          ]

          js = """async g => {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 10000);
            try {
              const r = await fetch('/goods/api/v1/detail?goodsNo=' + g,
                {signal:ctl.signal, headers:{Accept:'application/json'}});
              const type = r.headers.get('content-type') || '';
              const cf = r.headers.get('cf-mitigated') || 'none';
              if (!r.ok || !type.toLowerCase().includes('json'))
                return {http:r.status, cf, type};
              const data = await r.json();
              return {http:r.status, cf, type, data};
            } catch(e) {return {error:e.name};}
            finally {clearTimeout(timer);}
          }"""

          valid = 0

          with sync_playwright() as p:
              browser = p.chromium.launch(channel='chrome', headless=False)
              try:
                  for goods, wanted in items:
                      ctx = browser.new_context(locale='ko-KR', service_workers='block')
                      try:
                          page = ctx.new_page()
                          link = 'https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo=' + goods
                          r = page.goto(link, wait_until='domcontentloaded', timeout=25000)
                          print('GOODS', goods, 'PAGE_HTTP', r.status if r else 'NONE', flush=True)

                          if not r or r.status != 200 or r.headers.get('cf-mitigated') == 'challenge':
                              print('DATA: UNKNOWN (page blocked)', flush=True)
                              continue

                          page.wait_for_timeout(3000)
                          result = page.evaluate(js, goods)

                          print('API_HTTP', result.get('http','NONE'),
                                'CF',result.get('cf','none'),
                                'TYPE',result.get('type','none'),
                                'ERROR',result.get('error','none'),flush=True)

                          body = result.get('data')
                          d = body.get('data') if isinstance(body,dict) and body.get('status') == 'SUCCESS' and body.get('isSuccess') is True else None

                          if not isinstance(d,dict) or d.get('goodsNumber') != goods or not isinstance(d.get('options'),list) or not d['options']:
                              print('DATA: UNKNOWN (not valid product JSON)', flush=True)
                              continue

                          valid += 1

                          for number, label in wanted.items():
                              matched = [o for o in d['options'] if isinstance(o,dict)
                                  and o.get('optionNumber') == number
                                  and label in str(o.get('optionName',''))]

                              state = 'UNKNOWN'
                              delivery = 'UNKNOWN'

                              if len(matched) == 1:
                                  o = matched[0]
                                  if o.get('soldOutFlag') is True:
                                      state = 'OUT'
                                  elif o.get('soldOutFlag') is False and d.get('saleableFlag') is True:
                                      state = 'ORDERABLE'
                                      if o.get('reservationFlag') is True:
                                          delivery = 'RESERVATION_MARKED'
                                      elif o.get('reservationFlag') is False:
                                          delivery = 'NO_RESERVATION_FLAG'

                              print('OPTION',number,'ORDERABILITY',state,'DELIVERY',delivery,flush=True)

                      except Exception as exc:
                          print('ERROR',type(exc).__name__,'(status UNKNOWN)',flush=True)
                      finally:
                          ctx.close()
              finally:
                  browser.close()

          print('VALID_PRODUCTS:',str(valid)+'/2',flush=True)
          print('DIAGNOSTIC_FINISHED; NO ALERTS SENT',flush=True)
          PY
          # END - OLIVE MONITOR V6
