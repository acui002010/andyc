
name: Olive Monitor - Browser Source Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright

      - name: Check Olive Young public product pages
        shell: bash
        run: |
          xvfb-run -a python - <<'PY'
          import re
          from urllib.parse import urlparse, parse_qs
          from playwright.sync_api import sync_playwright

          # 本次测试先检查唇蜜，再检查腮红
          PRODUCTS = [
              ("A000000255435", ["101", "102", "107", "109"]),
              ("A000001004502", ["J02", "J05"]),
          ]

          BASE = "https://www.oliveyoung.co.kr"


          def summarize(data, goods, shades):
              if not isinstance(data, dict):
                  print("结果：不是有效 JSON")
                  return False

              if data.get("status") != "SUCCESS":
                  print("结果：商品接口未返回 SUCCESS")
                  return False

              detail = data.get("data")

              if not isinstance(detail, dict):
                  print("结果：商品数据结构不正确")
                  return False

              if detail.get("goodsNumber") != goods:
                  print("结果：商品编号不匹配")
                  return False

              options = detail.get("options")

              if not isinstance(options, list):
                  print("结果：没有完整商品选项")
                  return False

              print("有效商品数据：YES")
              print("商品编号：", goods)
              print("商品名称：", detail.get("goodsName"))
              print("选项数量：", len(options))
              print("商品可售：", detail.get("saleableFlag"))

              for shade in shades:
                  print("\n--- 色号", shade, "---")

                  pattern = re.compile(
                      r"(?<![A-Za-z0-9])" +
                      re.escape(shade) +
                      r"(?![A-Za-z0-9])",
                      re.I
                  )

                  matches = [
                      o for o in options
                      if isinstance(o, dict)
                      and pattern.search(
                          str(o.get("optionName", ""))
                      )
                  ]

                  if not matches:
                      print("状态：选项未出现，不能判定缺货")
                      continue

                  for o in matches:
                      sold = o.get("soldOutFlag")
                      reserve = o.get("reservationFlag")
                      saleable = detail.get("saleableFlag")

                      if sold is True:
                          state = "售罄"
                      elif sold is False and saleable is True:
                          if reserve is True:
                              state = "预售可下单信号"
                          elif reserve is False:
                              state = "普通可下单信号"
                          else:
                              state = "待确认"
                      else:
                          state = "待确认"

                      print("选项名称：", o.get("optionName"))
                      print("选项编号：", o.get("optionNumber"))
                      print("售罄标记：", sold)
                      print("预售标记：", reserve)
                      print("库存数量字段：", o.get("quantity"))
                      print("判断结果：", state)

                  if len(matches) > 1:
                      print(
                          "注意：同色号有多个商品版本，"
                          "必须按单品或套装分别判断。"
                      )

              return True


          def is_detail_response(response, goods):
              parsed = urlparse(response.url)

              return (
                  parsed.hostname == "www.oliveyoung.co.kr"
                  and parsed.path == "/goods/api/v1/detail"
                  and parse_qs(parsed.query).get("goodsNo")
                  == [goods]
              )


          def run_test(browser, goods, shades):
              print("\n================================")
              print("正在测试商品：", goods)
              print("目标色号：", ", ".join(shades))
              print("================================", flush=True)

              context = browser.new_context(
                  locale="ko-KR",
                  accept_downloads=False,
                  service_workers="block"
              )

              page = context.new_page()
              recorded = []

              page.on(
                  "response",
                  lambda response: recorded.append(response)
                  if is_detail_response(response, goods)
                  else None
              )

              try:
                  url = (
                      BASE +
                      "/store/goods/getGoodsDetail.do?goodsNo=" +
                      goods
                  )

                  try:
                      response = page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=25000
                      )

                      if response is None:
                          print("网页没有返回 HTTP 响应")
                          return

                      print("网页 HTTP：", response.status)
                      print(
                          "Cloudflare：",
                          response.headers.get(
                              "cf-mitigated", "无"
                          )
                      )

                  except Exception as e:
                      print(
                          "网页加载失败：",
                          type(e).__name__
                      )
                      return

                  if (
                      response.status != 200
                      or response.headers.get("cf-mitigated")
                      == "challenge"
                  ):
                      print(
                          "网页没有正常放行，"
                          "不尝试绕过验证。"
                      )
                      return

                  page.wait_for_timeout(9000)

                  title = page.title().lower()

                  if (
                      "just a moment" in title
                      or "attention required" in title
                  ):
                      print("检测到网页安全验证")
                      return

                  for res in recorded:
                      print(
                          "网页自动调用详情 API：HTTP",
                          res.status
                      )

                      ctype = res.headers.get(
                          "content-type", ""
                      ).lower()

                      if res.status == 200 and "json" in ctype:
                          try:
                              if summarize(
                                  res.json(), goods, shades
                              ):
                                  return
                          except Exception:
                              print("接口 JSON 解析失败")

                  print("尝试从已加载网页请求商品详情")

                  try:
                      result = page.evaluate(
                          """async goods => {
                              const url =
                                  '/goods/api/v1/detail?goodsNo='
                                  + encodeURIComponent(goods);

                              const r = await fetch(url, {
                                  headers: {
                                      'Accept': 'application/json'
                                  }
                              });

                              const type =
                                  r.headers.get('content-type')
                                  || '';

                              if (
                                  !r.ok ||
                                  !type.toLowerCase()
                                       .includes('json')
                              ) {
                                  return {
                                      status: r.status,
                                      type: type,
                                      data: null
                                  };
                              }

                              const text = await r.text();

                              if (text.length > 500000) {
                                  return {
                                      status: r.status,
                                      type: type,
                                      data: null
                                  };
                              }

                              try {
                                  return {
                                      status: r.status,
                                      type: type,
                                      data: JSON.parse(text)
                                  };
                              } catch (e) {
                                  return {
                                      status: r.status,
                                      type: type,
                                      data: null
                                  };
                              }
                          }""",
                          goods
                      )

                      print(
                          "网页内详情 API：HTTP",
                          result.get("status")
                      )

                      print(
                          "内容类型：",
                          result.get("type")
                      )

                      if isinstance(result.get("data"), dict):
                          summarize(
                              result["data"], goods, shades
                          )
                      else:
                          print("未取得有效库存 JSON")

                  except Exception as e:
                      print(
                          "网页内请求失败：",
                          type(e).__name__
                      )

              finally:
                  context.close()


          print("================================")
          print("Olive Monitor V1.3")
          print("Chrome 图形界面免费数据源测试")
          print("测试顺序：唇蜜 → 腮红")
          print("不发送通知，不修改阿里云")
          print("================================")

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  channel="chrome",
                  headless=False,
                  args=["--disable-dev-shm-usage"]
              )

              try:
                  for goods, shades in PRODUCTS:
                      run_test(browser, goods, shades)
              finally:
                  browser.close()

          print("\n================================")
          print("测试结束")
          print("测试结果不代表自动监控已经启动")
          print("================================")
          PY
