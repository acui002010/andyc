name: Olive Monitor - Dynamic Scan V7

'on':
  workflow_dispatch:
    inputs:
      goods_json:
        description: 'JSON array of Olive Young goods numbers; optional for manual test'
        required: false
        type: string
        default: '["A000000255435","A000001004502"]'
      batch_id:
        description: 'Random request ID from Olive Monitor; optional for manual test'
        required: false
        type: string
        default: manual

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check --quiet playwright
      - name: Scan online options (no notifications)
        shell: bash
        env:
          REQUEST_GOODS: ${{ inputs.goods_json }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          xvfb-run -a python - <<'PY'
          import json, os, re, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          bid = os.environ.get('BATCH_ID') or 'manual'
          if not re.fullmatch(r'[A-Za-z0-9_-]{1,48}', bid):
              raise SystemExit('Invalid batch_id')
          goods = json.loads(os.environ.get('REQUEST_GOODS') or '[]')
          if (not isinstance(goods, list) or not 1 <= len(goods) <= 12
                  or any(not isinstance(g, str) or not re.fullmatch(r'A[0-9]{12}',g) for g in goods)
                  or len(set(goods)) != len(goods)):
              raise SystemExit('Invalid goods list')

          js = """async goods => {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 10000);
            try {
              const r = await fetch('/goods/api/v1/detail?goodsNo=' + encodeURIComponent(goods),
                                    {signal:ctrl.signal,headers:{Accept:'application/json'}});
              const type = r.headers.get('content-type') || '';
              const cf = r.headers.get('cf-mitigated') || 'none';
              if (!r.ok || !type.toLowerCase().includes('json'))
                return {http:r.status,cf,type};
              const text = await r.text();
              if (text.length > 500000) return {http:r.status,cf,type,error:'too_large'};
              return {http:r.status,cf,type,body:JSON.parse(text)};
            } catch(e) { return {error:e.name}; }
            finally { clearTimeout(timer); }
          }"""
          report = {'schema':7,'batch_id':bid,'created_at':int(time.time()),'results':[]}
          with sync_playwright() as pw:
              browser = pw.chromium.launch(channel='chrome',headless=False)
              try:
                  for good in goods:
                      item = {'goods':good,'ok':False,'observed_at':int(time.time())}
                      ctx = browser.new_context(locale='ko-KR',service_workers='block')
                      try:
                          page = ctx.new_page()
                          link = 'https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo=' + good
                          response = page.goto(link,wait_until='domcontentloaded',timeout=25000)
                          code = response.status if response else 0
                          item['page_http'] = code
                          if code != 200 or response.headers.get('cf-mitigated') == 'challenge':
                              item['error'] = 'page_not_allowed'
                          else:
                              page.wait_for_timeout(3000)
                              result = page.evaluate(js,good)
                              item['api_http'] = result.get('http',0)
                              body = result.get('body')
                              data = body.get('data') if isinstance(body,dict) and body.get('status')=='SUCCESS' and body.get('isSuccess') is True else None
                              options = data.get('options') if isinstance(data,dict) else None
                              if (not isinstance(data,dict) or data.get('goodsNumber') != good
                                  or type(data.get('saleableFlag')) is not bool
                                  or not isinstance(options,list) or not options):
                                  item['error'] = 'api_incomplete'
                              else:
                                  seen = set(); selected = []
                                  for o in options:
                                      if (not isinstance(o,dict) or not isinstance(o.get('optionNumber'),str)
                                          or not isinstance(o.get('optionName'),str)
                                          or type(o.get('soldOutFlag')) is not bool
                                          or type(o.get('reservationFlag')) is not bool
                                          or o['optionNumber'] in seen):
                                          raise ValueError('invalid or duplicate option')
                                      seen.add(o['optionNumber'])
                                      selected.append({
                                          'optionNumber':o['optionNumber'],
                                          'optionName':o['optionName'],
                                          'soldOutFlag':o['soldOutFlag'],
                                          'reservationFlag':o['reservationFlag'],
                                          'reservationDeliveryDate':o.get('reservationDeliveryDate')
                                      })
                                  item.update(ok=True, observed_at=int(time.time()),
                                              saleableFlag=data['saleableFlag'],options=selected)
                                  print('VALID',good,'OPTIONS',len(selected),flush=True)
                      except Exception as e:
                          item = {'goods':good,'ok':False,'observed_at':int(time.time()),
                                  'error':type(e).__name__}
                      finally:
                          ctx.close()
                      if not item['ok']:
                          print('UNKNOWN',good,item.get('error','request_failed'),flush=True)
                      report['results'].append(item)
              finally:
                  browser.close()
          Path('olive-v7.json').write_text(json.dumps(report,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('V7_RESULTS',sum(x['ok'] for x in report['results']),'/',len(goods),
                'BATCH',bid,'NO_ALERTS_SENT',flush=True)
          PY
          # END OLIVE V7 PYTHON
          
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olive-v7-${{ inputs.batch_id || 'manual' }}
          path: olive-v7.json
          if-no-files-found: error
          retention-days: 1
# END OLIVE MONITOR V7

