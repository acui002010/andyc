
name: Olive Monitor - Source Quality Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -q playwright
      - name: Verify online shade data
        shell: bash
        run: |
          xvfb-run -a python - <<'PY'
          import sys
          from playwright.sync_api import sync_playwright
          items = [('A000000255435',{'007':'[단품]107','009':'[단품]109'}),
                   ('A000001004502',{'001':'J02','002':'J05'})]
          ok = 0
          js = """async g => {
            const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
            try {const r=await fetch('/goods/api/v1/detail?goodsNo='+g,{signal:c.signal});
              if(!r.ok||!(r.headers.get('content-type')||'').includes('json'))return null;
              return await r.json();
            } catch(e){return null;} finally{clearTimeout(t);}
          }"""
          with sync_playwright() as p:
              b = p.chromium.launch(channel='chrome',headless=False)
              try:
                  for goods, targets in items:
                      c = b.new_context(locale='ko-KR',service_workers='block')
                      try:
                          page = c.new_page()
                          url = 'https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo='+goods
                          r = page.goto(url,wait_until='domcontentloaded',timeout=25000)
                          print(goods,'PAGE',r.status if r else 'NONE',flush=True)
                          if not r or r.status!=200 or r.headers.get('cf-mitigated')=='challenge':
                              continue
                          page.wait_for_timeout(3000)
                          data = page.evaluate(js,goods)
                          d = data.get('data') if isinstance(data,dict) and data.get('status')=='SUCCESS' else None
                          if not isinstance(d,dict) or d.get('goodsNumber')!=goods or not isinstance(d.get('options'),list):
                              print(goods,'API: NO VALID JSON',flush=True)
                              continue
                          valid = True
                          for num,part in targets.items():
                              hits = [o for o in d['options'] if isinstance(o,dict) and str(o.get('optionNumber'))==num and part in str(o.get('optionName',''))]
                              if len(hits)!=1:
                                  state='UNKNOWN'
                              else:
                                  o=hits[0]
                                  if o.get('soldOutFlag') is True: state='OUT'
                                  elif o.get('soldOutFlag') is False and d.get('saleableFlag') is True:
                                      state={True:'PREORDER',False:'STOCK'}.get(o.get('reservationFlag'),'UNKNOWN')
                                  else: state='UNKNOWN'
                              print(' ',num,state,flush=True)
                              if state=='UNKNOWN': valid=False
                          if valid: ok+=1
                      except Exception as e:
                          print(goods,'ERROR',type(e).__name__,flush=True)
                      finally: c.close()
              finally: b.close()
          print('VALID PRODUCTS:',str(ok)+'/2',flush=True)
          sys.exit(0 if ok==2 else 1)
          PY
          # END - OLIVE MONITOR
